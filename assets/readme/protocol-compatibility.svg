<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">MCP-Doctor protocol compatibility</title>
<desc id="desc">First try modern server/discover using protocol version 2026-07-28. If not supported, fall back to initialize using known legacy MCP versions. Once a version is established, send tools/list and never execute advertised tools.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset="1" stop-color="#101d34"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#39e6bf"/></marker><style>
.h{font:700 30px Inter,system-ui,sans-serif;fill:#f4f8ff}.s{font:400 15px Inter,system-ui,sans-serif;fill:#8faecc}.t{font:700 18px Inter,system-ui,sans-serif;fill:#edf6ff}.b{font:400 14px Inter,system-ui,sans-serif;fill:#abc1d8}.mono{font:600 13px ui-monospace,monospace;fill:#9cf8e3}.c{fill:#0b1a2d;stroke:#2a4b6b;stroke-width:1.5}.a{fill:none;stroke:#39e6bf;stroke-width:2.8;marker-end:url(#arr)}
</style></defs>
<rect width="1440" height="550" rx="24" fill="url(#bg)"/><text x="52" y="60" class="h">Protocol compatibility strategy</text><text x="54" y="88" class="s">The doctor reads protocol metadata and tool definitions; it never calls tools advertised by the server.</text>
<rect x="65" y="150" width="255" height="110" rx="14" class="c" stroke="#38bdf8"/><text x="91" y="184" class="t">Start selected process</text><text x="91" y="214" class="b">Read newline-delimited JSON-RPC</text><text x="91" y="239" class="mono">bounded + timeout-controlled</text>
<rect x="390" y="150" width="300" height="110" rx="14" class="c" stroke="#34d399"/><text x="416" y="184" class="t">Modern discovery</text><text x="416" y="214" class="mono">server/discover</text><text x="416" y="239" class="b">protocol 2026-07-28</text>
<rect x="790" y="108" width="270" height="85" rx="14" fill="#10312a" stroke="#277b64"/><text x="816" y="140" class="t">Compatible modern server</text><text x="816" y="166" class="b">Select negotiated version</text>
<rect x="790" y="224" width="270" height="100" rx="14" fill="#211d3c" stroke="#5d4d97"/><text x="816" y="257" class="t">Legacy fallback</text><text x="816" y="285" class="mono">initialize + initialized</text><text x="816" y="306" class="b">2025-11-25 and earlier set</text>
<rect x="1130" y="150" width="245" height="110" rx="14" class="c" stroke="#fbbf24"/><text x="1155" y="184" class="t">tools/list</text><text x="1155" y="214" class="b">Check envelope + array + names</text><text x="1155" y="239" class="mono">0 tools/call requests</text>
<path d="M320 205 H382" class="a"/><path d="M690 185 H782" class="a"/><text x="735" y="171" class="mono">supported</text><path d="M690 230 H750 V275 H782" class="a"/><text x="698" y="253" class="mono">unknown / old</text><path d="M1060 150 H1095 V205 H1122" class="a"/><path d="M1060 270 H1095 V220 H1122" class="a"/>
<rect x="65" y="370" width="1310" height="113" rx="15" fill="#271c2a" stroke="#844a60"/><text x="91" y="407" font-family="Inter,system-ui" font-size="18" font-weight="700" fill="#fda4af">Safety invariants</text><text x="91" y="438" class="b">• stdin/stdout carry MCP messages only; stderr is drained separately and never copied to report evidence.</text><text x="91" y="462" class="b">• Server descriptions are untrusted text. Outputs are bounded and scrubbed; redaction is best-effort, not a guarantee.</text>
<text x="1370" y="520" text-anchor="end" class="mono">MCP SPEC REVISIONS SUPPORTED BY THE PROBE ARE LISTED IN THE README</text>
</svg>