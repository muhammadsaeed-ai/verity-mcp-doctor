<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">MCP-Doctor diagnostic report preview</title>
<desc id="desc">Visual preview of a successful MCP-Doctor run against the included synthetic fixture server: five checks pass, the modern handshake succeeds, one tool is listed but never executed, and no errors or warnings are reported.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101c32"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39e6bf"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <style>
 .h{font:700 25px Inter,system-ui,sans-serif;fill:#f4f8ff}.sub{font:400 13px Inter,system-ui,sans-serif;fill:#8faecc}
 .t{font:700 15px Inter,system-ui,sans-serif;fill:#edf6ff}.b{font:400 13px Inter,system-ui,sans-serif;fill:#abc1d8}
 .mono{font:600 12px ui-monospace,monospace;fill:#9cf8e3}.small{font:500 11px Inter,system-ui,sans-serif;fill:#8faecc}
 .card{fill:#0b1a2d;stroke:#294766;stroke-width:1.4}.pass{fill:#0d312a;stroke:#277b64;stroke-width:1.2}
 </style>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="464" rx="18" fill="#091526" stroke="#294766" stroke-width="1.5"/>
<rect x="28" y="28" width="1144" height="52" rx="18" fill="#13243a"/><rect x="28" y="61" width="1144" height="19" fill="#13243a"/>
<circle cx="54" cy="54" r="5" fill="#f87171"/><circle cx="72" cy="54" r="5" fill="#fbbf24"/><circle cx="90" cy="54" r="5" fill="#39e6bf"/>
<text x="116" y="59" class="mono">mcp-doctor · diagnostic report</text>
<rect x="880" y="43" width="254" height="28" rx="14" class="pass"/><circle cx="899" cy="57" r="4" fill="#39e6bf"/><text x="912" y="61" font-family="Inter,system-ui" font-size="11" font-weight="700" fill="#9cf8e3">PASS · SYNTHETIC FIXTURE</text>
<text x="58" y="121" class="h">MCP-Doctor</text><text x="58" y="145" class="sub">Successful, bounded stdio diagnostic · representative preview</text>
<rect x="58" y="169" width="330" height="81" rx="12" class="card"/><text x="78" y="195" class="small">TARGET</text><text x="78" y="220" class="t">fixture-server</text><text x="78" y="239" class="mono">transport: stdio</text>
<rect x="406" y="169" width="330" height="81" rx="12" class="card"/><text x="426" y="195" class="small">PROTOCOL</text><text x="426" y="220" class="t">2026-07-28</text><text x="426" y="239" class="mono">server/discover · success</text>
<rect x="754" y="169" width="388" height="81" rx="12" class="card"/><text x="774" y="195" class="small">TOOL CATALOGUE</text><text x="774" y="220" class="t">1 advertised tool</text><text x="774" y="239" class="mono">echo · listed, not called</text>
<text x="58" y="287" class="t">Evidence-led checks</text>
<g>
 <rect x="58" y="305" width="1084" height="34" rx="8" class="pass"/><circle cx="78" cy="322" r="6" fill="#39e6bf"/><path d="M75 322 l2 2 l4 -5" stroke="#08221c" stroke-width="1.8" fill="none"/><text x="95" y="326" class="mono">MCPD-CFG-VALID</text><text x="300" y="326" class="b">Configuration structure is valid</text><text x="1116" y="326" text-anchor="end" class="mono">PASS</text>
 <rect x="58" y="347" width="1084" height="34" rx="8" class="pass"/><circle cx="78" cy="364" r="6" fill="#39e6bf"/><path d="M75 364 l2 2 l4 -5" stroke="#08221c" stroke-width="1.8" fill="none"/><text x="95" y="368" class="mono">MCPD-CFG-EXEC</text><text x="300" y="368" class="b">Server executable resolved</text><text x="1116" y="368" text-anchor="end" class="mono">PASS</text>
 <rect x="58" y="389" width="1084" height="34" rx="8" class="pass"/><circle cx="78" cy="406" r="6" fill="#39e6bf"/><path d="M75 406 l2 2 l4 -5" stroke="#08221c" stroke-width="1.8" fill="none"/><text x="95" y="410" class="mono">MCPD-PROTO-001</text><text x="300" y="410" class="b">Modern discovery succeeded</text><text x="1116" y="410" text-anchor="end" class="mono">PASS</text>
 <rect x="58" y="431" width="1084" height="34" rx="8" class="pass"/><circle cx="78" cy="448" r="6" fill="#39e6bf"/><path d="M75 448 l2 2 l4 -5" stroke="#08221c" stroke-width="1.8" fill="none"/><text x="95" y="452" class="mono">MCPD-PROTO-TOOLS</text><text x="300" y="452" class="b">Tool discovery succeeded — no tool execution</text><text x="1116" y="452" text-anchor="end" class="mono">PASS</text>
</g>
<text x="58" y="481" class="small">Illustrative UI preview, not a captured log. Exact findings and duration depend on the run.</text>
</svg>