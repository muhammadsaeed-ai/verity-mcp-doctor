name: Generate README hero animation

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_readme_hero.py"
      - ".github/workflows/readme-visuals.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-hero-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install "Pillow>=10.0"

      - name: Generate deterministic animated hero
        run: python scripts/generate_readme_hero.py

      - name: Commit generated GIF when changed
        run: |
          git add assets/readme/hero-animation.gif
          if git diff --cached --quiet; then
            echo "Hero animation is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate animated README hero"
          git push origin HEAD:main
