<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">MCP-Doctor implemented architecture</title>
<desc id="desc">Configuration parser and safety gate feed an explicitly launched stdio process. A bounded JSON-RPC reader probes modern server discovery or the legacy initialize handshake, lists tool schemas without calling tools, then generates text or JSON findings.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset="1" stop-color="#101c32"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39e6bf"/><stop offset="1" stop-color="#22b8a4"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#39e6bf"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
 <style>
 .h{font:700 32px Inter,system-ui,sans-serif;fill:#f4f8ff}.sub{font:400 16px Inter,system-ui,sans-serif;fill:#8faecc}
 .t{font:700 18px Inter,system-ui,sans-serif;fill:#edf6ff}.b{font:400 14px Inter,system-ui,sans-serif;fill:#abc1d8}.sm{font:500 12px Inter,system-ui,sans-serif;fill:#7f9dbb}
 .mono{font:600 13px ui-monospace,monospace;fill:#9cf8e3}.card{fill:#0b1a2d;stroke:#284969;stroke-width:1.5}.line{fill:none;stroke:#39e6bf;stroke-width:2.8;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1440" height="820" rx="25" fill="url(#bg)"/><circle cx="1330" cy="95" r="180" fill="#2563eb" opacity=".07"/><circle cx="95" cy="780" r="200" fill="#0f766e" opacity=".07"/>
<text x="52" y="65" class="h">MCP-Doctor · Implemented architecture</text><text x="54" y="94" class="sub">Local configuration → bounded stdio protocol probe → evidence-led report</text>
<g filter="url(#shadow)">
 <rect x="48" y="145" width="280" height="238" rx="17" class="card"/>
 <rect x="365" y="145" width="300" height="238" rx="17" class="card"/>
 <rect x="702" y="145" width="330" height="238" rx="17" class="card"/>
 <rect x="1070" y="145" width="322" height="238" rx="17" class="card"/>
</g>
<rect x="48" y="145" width="280" height="6" rx="3" fill="#38bdf8"/><rect x="365" y="145" width="300" height="6" rx="3" fill="#a78bfa"/><rect x="702" y="145" width="330" height="6" rx="3" fill="#fbbf24"/><rect x="1070" y="145" width="322" height="6" rx="3" fill="#39e6bf"/>
<text x="72" y="187" class="t">01 · Configuration</text>
<text x="72" y="220" class="b">• Read JSON only</text><text x="72" y="246" class="b">• Validate mcpServers shape</text><text x="72" y="272" class="b">• Resolve env placeholders</text><text x="72" y="298" class="b">• Resolve executable + cwd</text><text x="72" y="336" class="mono">validate ≠ execute</text>
<text x="389" y="187" class="t">02 · Explicit process gate</text>
<text x="389" y="220" class="b">• check starts selected server</text><text x="389" y="246" class="b">• shell=False, argv list</text><text x="389" y="272" class="b">• bounded request timeout</text><text x="389" y="298" class="b">• stdout and stderr separated</text><text x="389" y="336" class="mono">no arbitrary tool calls</text>
<text x="726" y="187" class="t">03 · Protocol inspector</text>
<rect x="726" y="210" width="130" height="61" rx="10" fill="#122c3a" stroke="#248b80"/><text x="791" y="233" text-anchor="middle" class="mono">2026-07-28</text><text x="791" y="253" text-anchor="middle" class="sm">server/discover</text>
<rect x="873" y="210" width="132" height="61" rx="10" fill="#251f3e" stroke="#7464a8"/><text x="939" y="233" text-anchor="middle" class="mono">2025 and earlier</text><text x="939" y="253" text-anchor="middle" class="sm">initialize fallback</text>
<text x="726" y="304" class="b">• Parse JSON-RPC envelopes</text><text x="726" y="330" class="b">• Validate tools/list schema only</text><text x="726" y="356" class="sm">No tools/call · no remote HTTP in v0.2</text>
<text x="1094" y="187" class="t">04 · Findings + reports</text>
<text x="1094" y="220" class="b">• Stable rule IDs + severity</text><text x="1094" y="246" class="b">• Evidence + corrective next step</text><text x="1094" y="272" class="b">• JSON for automation</text><text x="1094" y="298" class="b">• Readable terminal summary</text><text x="1094" y="336" class="mono">exit 0 / exit 1</text>
<path d="M328 264 H357" class="line"/><path d="M665 264 H694" class="line"/><path d="M1032 264 H1062" class="line"/>
<rect x="48" y="423" width="1344" height="104" rx="16" fill="#101f32" stroke="#284969"/><text x="75" y="459" class="t">Diagnostic pipeline output</text>
<rect x="75" y="476" width="250" height="31" rx="8" fill="#102f30" stroke="#226c62"/><text x="200" y="496" text-anchor="middle" class="mono">MCPD-PROTO-001 · Discovery OK</text>
<rect x="345" y="476" width="250" height="31" rx="8" fill="#312818" stroke="#826126"/><text x="470" y="496" text-anchor="middle" class="mono">MCPD-PROTO-016 · Schema warning</text>
<rect x="615" y="476" width="250" height="31" rx="8" fill="#311b25" stroke="#823e58"/><text x="740" y="496" text-anchor="middle" class="mono">MCPD-PROTO-010 · Early exit</text>
<rect x="885" y="476" width="250" height="31" rx="8" fill="#14293e" stroke="#385a7c"/><text x="1010" y="496" text-anchor="middle" class="mono">MCPD-CFG-013 · Command missing</text>
<text x="1162" y="496" class="sm">Illustrative rule IDs</text>
<rect x="48" y="564" width="1344" height="174" rx="16" fill="#271c2a" stroke="#844a60" stroke-width="1.4"/>
<text x="76" y="603" font-family="Inter,system-ui" font-size="19" font-weight="700" fill="#fda4af">Security boundaries</text>
<text x="76" y="638" class="b">Configuration validation never starts configured executables. Only the explicit check command does.</text>
<text x="76" y="666" class="b">The probe uses shell=False, size-limited newline-delimited JSON-RPC, per-request timeouts, and separate stderr draining.</text>
<text x="76" y="694" class="b">It lists tools but never calls them. Reports avoid copying raw stderr or raw malformed stdout; secret scrubbing remains best-effort.</text>
<text x="1368" y="786" text-anchor="end" class="sm">MCP-DOCTOR · V0.2.0 · STDIO FIRST</text>
</svg>