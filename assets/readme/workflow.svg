<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">MCP-Doctor diagnostic workflow</title>
<desc id="desc">Inspect config without execution, select an explicitly configured local stdio server, start process safely, try modern discovery then legacy initialize, list tool definitions without calling them, and create findings.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset="1" stop-color="#101d34"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#39e6bf"/></marker><style>
.h{font:700 30px Inter,system-ui,sans-serif;fill:#f4f8ff}.s{font:400 15px Inter,system-ui,sans-serif;fill:#8faecc}.t{font:700 17px Inter,system-ui,sans-serif;fill:#edf6ff}.b{font:400 14px Inter,system-ui,sans-serif;fill:#abc1d8}.mono{font:600 12px ui-monospace,monospace;fill:#9cf8e3}.c{fill:#0b1a2d;stroke:#2a4b6b;stroke-width:1.5}.a{fill:none;stroke:#39e6bf;stroke-width:2.8;marker-end:url(#arr)}
</style></defs>
<rect width="1440" height="610" rx="24" fill="url(#bg)"/><text x="50" y="60" class="h">A diagnostic run, from config to finding</text><text x="52" y="88" class="s">Read-only checks first. Process execution is deliberate. Active tool invocation is out of scope.</text>
<g>
<rect x="50" y="139" width="270" height="170" rx="15" class="c" stroke="#38bdf8"/><circle cx="79" cy="170" r="15" fill="#38bdf8"/><text x="79" y="175" text-anchor="middle" font-family="Inter,system-ui" font-weight="700" font-size="13" fill="#06101d">1</text><text x="105" y="175" class="t">Validate config</text><text x="73" y="212" class="b">JSON syntax, entry shapes,</text><text x="73" y="235" class="b">command and env structure.</text><rect x="73" y="256" width="223" height="31" rx="7" fill="#102b3a" stroke="#28677e"/><text x="184" y="276" text-anchor="middle" class="mono">mcp-doctor validate</text>
<rect x="365" y="139" width="270" height="170" rx="15" class="c" stroke="#a78bfa"/><circle cx="394" cy="170" r="15" fill="#a78bfa"/><text x="394" y="175" text-anchor="middle" font-family="Inter,system-ui" font-weight="700" font-size="13" fill="#06101d">2</text><text x="420" y="175" class="t">Select one server</text><text x="388" y="212" class="b">Resolve executable, working</text><text x="388" y="235" class="b">directory, and env placeholders.</text><rect x="388" y="256" width="223" height="31" rx="7" fill="#211d3c" stroke="#5d4d97"/><text x="499" y="276" text-anchor="middle" class="mono">mcp-doctor servers</text>
<rect x="680" y="139" width="270" height="170" rx="15" class="c" stroke="#fbbf24"/><circle cx="709" cy="170" r="15" fill="#fbbf24"/><text x="709" y="175" text-anchor="middle" font-family="Inter,system-ui" font-weight="700" font-size="13" fill="#06101d">3</text><text x="735" y="175" class="t">Launch + handshake</text><text x="703" y="212" class="b">shell=False, timeout-bound;</text><text x="703" y="235" class="b">modern discovery, then fallback.</text><rect x="703" y="256" width="223" height="31" rx="7" fill="#312818" stroke="#826126"/><text x="814" y="276" text-anchor="middle" class="mono">mcp-doctor check</text>
<rect x="995" y="139" width="395" height="170" rx="15" class="c" stroke="#34d399"/><circle cx="1024" cy="170" r="15" fill="#34d399"/><text x="1024" y="175" text-anchor="middle" font-family="Inter,system-ui" font-weight="700" font-size="13" fill="#06101d">4</text><text x="1050" y="175" class="t">Inspect tool catalogue</text><text x="1018" y="212" class="b">Validate names and input schemas.</text><text x="1018" y="235" class="b">Never send tools/call during the probe.</text><rect x="1018" y="256" width="344" height="31" rx="7" fill="#10312a" stroke="#277b64"/><text x="1190" y="276" text-anchor="middle" class="mono">list only · no tool side effects</text>
<path d="M320 224 H357 M635 224 H672 M950 224 H987" class="a"/>
</g>
<path d="M1190 309 V350 H935" class="a"/>
<rect x="500" y="350" width="560" height="97" rx="15" fill="#101f32" stroke="#2a4b6b"/><text x="528" y="382" class="t">5 · Evidence-led report</text><text x="528" y="409" class="b">Stable finding IDs · severity · evidence · suggested next step · JSON / text</text><text x="528" y="432" class="mono">error → exit 1   |   no errors → exit 0</text>
<rect x="50" y="480" width="1340" height="80" rx="14" fill="#271c2a" stroke="#844a60"/><text x="76" y="510" font-family="Inter,system-ui" font-size="17" font-weight="700" fill="#fda4af">What is deliberately not done?</text><text x="76" y="537" class="b">No tool invocation · no unbounded reads · no raw stderr in reports · no remote URL transport in this release · no telemetry.</text>
<text x="1380" y="588" text-anchor="end" class="mono">MCP-DOCTOR / SAFE STDIO DIAGNOSTICS</text>
</svg>